name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: pip install -r requirements.txt pyinstaller -U

      - name: Build Executables
        run: |
          # Build GUI
          pyinstaller -y -F -w -i "extra/ZeroTuition.ico" --clean --name "ZeroTuition-GUI-windows" `
          --add-data "base.py;." `
          --add-data "default-zerotuition-gui-settings.json;." `
          --add-data "README.md;." `
          --add-data "LICENSE;." `
          "gui.py"

          # Build CLI
          pyinstaller -y -F -c -i "extra/ZeroTuition.ico" --clean --name "ZeroTuition-CLI-windows" `
          --add-data "base.py;." `
          --add-data "default-zerotuition-cli-settings.json;." `
          --add-data "README.md;." `
          --add-data "LICENSE;." `
          "cli.py"

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTuition-windows-package
          path: ./dist/

      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          $version = (Select-String -Path .\base.py -Pattern 'VERSION = "(v.*?)"').Matches.Groups[1].Value
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "TAG=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: ZeroTuition ${{ steps.get_version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatic build of **ZeroTuition ${{ steps.get_version.outputs.TAG }}**.

            **Downloads**
            - `ZeroTuition-GUI-windows.exe` — desktop app
            - `ZeroTuition-CLI-windows.exe` — terminal app (add `--no-menu` for scheduled runs)

            Antivirus note: these builds are unsigned, so SmartScreen or your
            antivirus may warn — choose *More info* → *Run anyway*.
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          files: |
            ./dist/*
